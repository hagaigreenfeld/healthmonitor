<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="מעקב בריאות" />
  <title>מעקב בריאות</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #ff6b9d;
      --purple: #a855f7;
      --blue: #60a5fa;
      --teal: #2dd4bf;
      --yellow: #fbbf24;
      --orange: #fb923c;
      --red: #f87171;
      --bg: #fdf4ff;
      --card: #ffffff;
      --text: #2d1b69;
      --muted: #9ca3af;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Hebrew', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* ── Header ── */
    .header {
      position: relative;
      height: 100px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 0 20px 18px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
    }
    .header-content {
      position: relative; z-index: 2;
      width: 100%; display: flex;
      align-items: flex-end; justify-content: space-between;
    }
    .header h1 {
      font-size: 22px; font-weight: 800; color: white;
      letter-spacing: -0.3px; line-height: 1.2;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }
    .header-greeting {
      font-size: 15px; font-weight: 600; color: white;
      opacity: 0.92; text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    /* ── Tab bar ── */
    .tabs {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #f3e8ff;
      display: flex;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(168,85,247,0.1);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 10px 0 14px;
      font-size: 11px; font-weight: 600; color: var(--muted);
      border: none; background: none; cursor: pointer; gap: 3px;
    }
    .tab .tab-icon { font-size: 22px; }
    .tab.active { color: var(--purple); }

    /* ── Pages ── */
    .page { display: none; padding: 12px 16px; }
    .page.active { display: block; }

    /* ── Issue type chips ── */
    .issue-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .issue-chip {
      padding: 9px 16px; border-radius: 20px; border: 2px solid #e9d5ff;
      font-size: 14px; font-weight: 700; color: var(--purple); background: white;
      cursor: pointer; transition: all 0.12s;
    }
    .issue-chip.active { background: var(--purple); color: white; border-color: var(--purple); }

    .edit-banner {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #ede9fe; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px;
      font-weight: 700; color: var(--purple); font-size: 14px;
    }
    .edit-banner button { width: auto; padding: 6px 14px; margin: 0; }

    /* ── Record page ── */
    .record-card {
      background: white;
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: 0 4px 24px rgba(168,85,247,0.12);
      text-align: center;
    }
    .record-card .big-emoji { font-size: 36px; margin-bottom: 0; display: block; line-height: 1; }
    .record-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }

    #gauge-svg { width: 100%; max-width: 210px; margin: 0 auto 4px; display: block; touch-action: none; cursor: pointer; }
    #gauge-svg path { transition: opacity 0.15s; }
    #gauge-svg path.dimmed { opacity: 0.35; }

    .note-area {
      width: 100%; border: 2px solid #e9d5ff; border-radius: 12px;
      padding: 6px 10px; font-size: 13px; font-family: inherit;
      color: var(--text); resize: none; outline: none;
      margin-bottom: 8px;
    }
    .note-area:focus { border-color: var(--purple); }

    .datetime-row {
      display: flex; gap: 8px; margin-bottom: 8px;
    }
    .datetime-row label {
      flex: 1; display: flex; flex-direction: column; gap: 5px;
      font-size: 13px; font-weight: 600; color: var(--purple); text-align: right;
    }
    .datetime-row input {
      width: 100%; border: 2px solid #e9d5ff; border-radius: 12px;
      padding: 6px 10px; font-size: 13px; font-family: inherit;
      color: var(--text); outline: none; background: white;
      direction: ltr; text-align: center;
    }
    .datetime-row input:focus { border-color: var(--purple); }

    /* custom time picker */
    .time-display {
      width: 100%; border: 2px solid #e9d5ff; border-radius: 12px;
      padding: 6px 10px; font-size: 14px; font-weight: 600;
      color: var(--text); background: white; text-align: center;
      cursor: pointer; user-select: none; direction: ltr;
    }
    .time-display:active { border-color: var(--purple); background: #faf5ff; }

    .time-modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .time-modal-backdrop.open { display: flex; }
    .time-modal {
      background: white; border-radius: 24px 24px 0 0;
      padding: 20px 16px 36px; width: 100%; max-height: 65vh;
      display: flex; flex-direction: column;
    }
    .time-modal-title {
      text-align: center; font-size: 15px; font-weight: 700;
      color: var(--purple); margin-bottom: 16px;
    }
    .time-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; overflow-y: auto;
    }
    .time-opt {
      padding: 12px 4px; border-radius: 12px; border: 2px solid #e9d5ff;
      font-size: 15px; font-weight: 600; text-align: center;
      cursor: pointer; background: white; color: var(--text);
      transition: all 0.1s; direction: ltr;
    }
    .time-opt.selected { background: var(--purple); color: white; border-color: var(--purple); }
    .time-opt:active { transform: scale(0.95); }

    /* open/close + duration */
    .toggle-duration-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    }
    .toggle-duration-row #duration-input-wrap { flex: 1; }
    .toggle-row {
      display: flex; align-items: center; gap: 8px; justify-content: flex-end;
      font-size: 13px; font-weight: 600; color: var(--purple); white-space: nowrap;
    }
    .toggle-row input { width: 18px; height: 18px; }

    /* dynamic custom fields */
    #custom-fields-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 8px;
    }
    .custom-field { text-align: right; }
    .custom-field label {
      display: block; font-size: 10px; font-weight: 700; color: var(--purple); margin-bottom: 2px;
    }
    .custom-field select, .custom-field input {
      width: 100%; border: 2px solid #e9d5ff; border-radius: 10px;
      padding: 6px 8px; font-size: 12px; font-family: inherit;
      color: var(--text); outline: none; background: white;
    }

    .save-btn {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white; border: none; border-radius: 50%;
      font-size: 22px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(168,85,247,0.35);
      transition: transform 0.12s, box-shadow 0.12s;
      display: block; margin: 0 auto;
    }
    .save-btn:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(168,85,247,0.25); }
    .save-btn:disabled { background: #e5e7eb; color: #d1d5db; box-shadow: none; cursor: default; }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
      background: #2d1b69; color: white; padding: 12px 24px;
      border-radius: 50px; font-size: 15px; font-weight: 600;
      z-index: 999; transition: transform 0.35s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Medical page ── */
    .med-subtabs {
      display: flex; gap: 10px; margin-bottom: 18px;
    }
    .med-subtab {
      flex: 1; padding: 10px 0; border-radius: 14px; border: 2px solid #e9d5ff;
      font-size: 14px; font-weight: 700; color: var(--purple); background: white;
      cursor: pointer; transition: all 0.15s;
    }
    .med-subtab.active { background: var(--purple); color: white; border-color: var(--purple); }

    .med-section { display: none; }
    .med-section.active { display: block; }

    /* visit cards */
    .visit-card {
      background: white; border-radius: 18px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(168,85,247,0.08); overflow: hidden;
    }
    .visit-header {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      cursor: pointer;
    }
    .visit-icon {
      width: 44px; height: 44px; border-radius: 12px; background: #ede9fe;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      flex-shrink: 0;
    }
    .visit-meta { flex: 1; }
    .visit-meta .v-doctor { font-size: 15px; font-weight: 700; color: var(--text); }
    .visit-meta .v-date { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .visit-chevron { font-size: 18px; color: var(--muted); transition: transform 0.2s; }
    .visit-card.open .visit-chevron { transform: rotate(180deg); }
    .visit-body {
      display: none; padding: 0 16px 16px; border-top: 1px solid #f3e8ff;
    }
    .visit-card.open .visit-body { display: block; }
    .visit-summary {
      font-size: 14px; color: var(--text); line-height: 1.6; margin-top: 12px; white-space: pre-wrap;
    }
    .visit-files { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .file-chip {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: #f3e8ff; border-radius: 20px; font-size: 13px;
      color: var(--purple); font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .visit-delete-btn {
      margin-top: 12px; background: none; border: none; color: #f87171;
      font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;
    }

    /* add visit form */
    .add-panel {
      background: white; border-radius: 18px; padding: 18px;
      box-shadow: 0 2px 10px rgba(168,85,247,0.1); margin-bottom: 16px;
      display: none;
    }
    .add-panel.open { display: block; }
    .field-label {
      font-size: 13px; font-weight: 700; color: var(--purple);
      display: block; margin-bottom: 6px;
    }
    .field-input {
      width: 100%; border: 2px solid #e9d5ff; border-radius: 12px;
      padding: 10px 12px; font-size: 15px; font-family: inherit;
      color: var(--text); outline: none; background: white; margin-bottom: 14px;
    }
    .field-input:focus { border-color: var(--purple); }
    .field-textarea {
      width: 100%; border: 2px solid #e9d5ff; border-radius: 12px;
      padding: 10px 12px; font-size: 15px; font-family: inherit; resize: none;
      color: var(--text); outline: none; background: white; margin-bottom: 14px;
    }
    .field-textarea:focus { border-color: var(--purple); }
    .file-upload-label {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      border: 2px dashed #c4b5fd; border-radius: 12px; cursor: pointer;
      color: var(--purple); font-size: 14px; font-weight: 600; margin-bottom: 14px;
    }
    .file-upload-label input { display: none; }
    .file-preview-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .file-preview-chip {
      display: flex; align-items: center; gap: 4px; padding: 4px 10px;
      background: #ede9fe; border-radius: 20px; font-size: 12px; color: var(--purple);
    }
    .file-preview-chip button {
      background: none; border: none; color: var(--purple); cursor: pointer;
      font-size: 14px; padding: 0 2px; line-height: 1;
    }
    .form-row { display: flex; gap: 10px; }
    .form-row .field-input { flex: 1; }
    .btn-primary {
      width: 100%; padding: 14px; background: linear-gradient(135deg,var(--pink),var(--purple));
      color: white; border: none; border-radius: 14px; font-size: 16px;
      font-weight: 700; cursor: pointer; margin-bottom: 8px;
    }
    .btn-ghost {
      width: 100%; padding: 10px; background: none; border: 2px solid #e9d5ff;
      border-radius: 14px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .add-trigger-btn {
      width: 100%; padding: 14px; background: white;
      border: 2px dashed #c4b5fd; border-radius: 16px;
      font-size: 15px; font-weight: 700; color: var(--purple);
      cursor: pointer; margin-bottom: 16px; display: flex;
      align-items: center; justify-content: center; gap: 8px;
    }

    /* todo list */
    .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .quick-chip {
      padding: 8px 14px; border-radius: 20px; border: 2px solid #e9d5ff;
      font-size: 13px; font-weight: 600; color: var(--purple); background: white;
      cursor: pointer; transition: all 0.12s;
    }
    .quick-chip:active { background: var(--purple); color: white; }
    .todo-add-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .todo-add-row .field-input { flex: 1; margin-bottom: 0; }
    .todo-add-btn {
      padding: 10px 18px; background: var(--purple); color: white;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .todo-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: white; border-radius: 14px; margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(168,85,247,0.06);
    }
    .todo-item.done { opacity: 0.55; }
    .todo-check {
      width: 26px; height: 26px; border-radius: 8px; border: 2px solid #c4b5fd;
      background: white; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 14px; flex-shrink: 0; transition: all 0.15s;
    }
    .todo-item.done .todo-check { background: var(--purple); border-color: var(--purple); color: white; }
    .todo-text { flex: 1; font-size: 15px; color: var(--text); }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; }
    .med-empty { text-align: center; padding: 36px 20px; color: var(--muted); font-size: 14px; }
    .med-empty .med-empty-emoji { font-size: 48px; display: block; margin-bottom: 10px; }

    /* ── History page ── */
    .section-title {
      font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--text);
    }

    .history-empty {
      text-align: center; padding: 48px 20px;
      color: var(--muted); font-size: 15px;
    }
    .history-empty .empty-emoji { font-size: 56px; margin-bottom: 12px; display: block; }

    .entry-card {
      background: white; border-radius: 18px; padding: 14px 16px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 2px 10px rgba(168,85,247,0.08);
    }
    .entry-badge {
      min-width: 46px; height: 46px; border-radius: 13px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; gap: 1px; flex-shrink: 0;
    }
    .entry-badge .badge-emoji { font-size: 20px; }
    .entry-badge .badge-num { font-size: 13px; font-weight: 800; }
    .entry-info { flex: 1; min-width: 0; }
    .entry-info .entry-date { font-size: 13px; color: var(--muted); }
    .entry-info .entry-note { font-size: 14px; margin-top: 2px; color: var(--text); }
    .entry-info .entry-status { font-size: 12px; font-weight: 700; margin-top: 2px; }
    .entry-info .entry-status.open { color: var(--orange); }
    .entry-info .entry-status.closed { color: var(--muted); }
    .entry-actions { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .entry-close-btn {
      background: #ede9fe; border: none; color: var(--purple); font-size: 11px;
      font-weight: 700; border-radius: 10px; padding: 5px 8px; cursor: pointer; white-space: nowrap;
    }
    .entry-delete {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: var(--muted); padding: 4px;
    }

    /* ── Stats page ── */
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: white; border-radius: 18px; padding: 16px;
      text-align: center; box-shadow: 0 2px 10px rgba(168,85,247,0.08);
    }
    .stat-card .stat-emoji { font-size: 32px; margin-bottom: 4px; }
    .stat-card .stat-val { font-size: 26px; font-weight: 800; color: var(--purple); }
    .stat-card .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .chart-card {
      background: white; border-radius: 18px; padding: 18px;
      box-shadow: 0 2px 10px rgba(168,85,247,0.08); margin-bottom: 16px;
    }
    .chart-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .chart-card canvas { max-height: 200px; }

    /* ── Auth screen ── */
    .auth-screen {
      position: fixed; inset: 0; z-index: 500;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .auth-card {
      background: white; border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25); text-align: center;
    }
    .auth-logo { font-size: 48px; margin-bottom: 8px; }
    .auth-card h1 { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: var(--text); }
    .auth-error { color: var(--red); font-size: 13px; font-weight: 600; margin: -6px 0 12px; min-height: 16px; }

    /* ── Settings page ── */
    .settings-user-row {
      display: flex; align-items: center; justify-content: space-between;
      background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(168,85,247,0.08);
    }
    .settings-user-row span { font-size: 13px; color: var(--muted); direction: ltr; }
    .settings-user-row button { width: auto; padding: 8px 16px; margin: 0; }
    .issue-type-card {
      background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 10px rgba(168,85,247,0.08);
    }
    .issue-type-card .it-emoji { font-size: 26px; }
    .issue-type-card .it-name { flex: 1; font-weight: 700; }
    .issue-type-card .it-fields-count { font-size: 12px; color: var(--muted); }
    .custom-field-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .custom-field-row input, .custom-field-row select { margin-bottom: 0; }
    .custom-field-row .cf-del { background: none; border: none; color: var(--red); font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

<!-- AUTH -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🩺</div>
    <h1 id="auth-title">התחברות</h1>
    <input class="field-input" id="auth-name" type="text" placeholder="שם" style="display:none" />
    <input class="field-input" id="auth-email" type="email" placeholder="אימייל" autocomplete="email" />
    <input class="field-input" id="auth-password" type="password" placeholder="סיסמה" autocomplete="current-password" />
    <div class="auth-error" id="auth-error"></div>
    <button class="btn-primary" id="auth-submit-btn">התחברות</button>
    <button class="btn-ghost" id="auth-toggle-btn">אין לך חשבון? הרשמה</button>
  </div>
</div>

<div id="app-root" style="display:none">

<div class="header">
  <div class="header-content">
    <h1>מעקב בריאות</h1>
    <div class="header-greeting" id="header-greeting">שלום 👋</div>
  </div>
</div>

<div class="toast" id="toast">✅ נשמר!</div>

<!-- RECORD -->
<div class="page active" id="page-record">
  <div class="edit-banner" id="edit-banner" style="display:none">
    <span>✏️ עריכת רשומה</span>
    <button class="btn-ghost" id="cancel-edit-btn">ביטול</button>
  </div>
  <div class="issue-chip-row" id="record-issue-chips"></div>

  <div class="record-card">
    <span class="big-emoji" id="record-emoji">🤕</span>
    <h2>כמה זה כואב?</h2>

    <svg id="gauge-svg" viewBox="0 0 300 165">
      <g id="gauge-segments"></g>
      <line id="gauge-needle" x1="150" y1="155" x2="248" y2="155"
            stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round"
            style="transform-origin:150px 155px;transform:rotate(0deg);transition:transform 0.35s cubic-bezier(.34,1.56,.64,1)"/>
      <circle cx="150" cy="155" r="10" fill="#1e1b4b"/>
      <circle cx="150" cy="155" r="5" fill="white"/>
      <text id="gauge-num" x="150" y="118" text-anchor="middle" dominant-baseline="middle"
            font-size="32" font-weight="800" fill="#2d1b69"

<script type="module">
import { auth } from './js/firebase.js';
import { signUp, signIn, signOutUser, onAuthChange, seedDefaultIssueTypeIfEmpty } from './js/auth.js';
import * as Data from './js/data.js';
import { Timestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

// ── State ─────────────────────────────────────────────────────
let currentUser = null;
let issueTypes = [];
let selectedRecordIssueTypeId = null;
let historyFilterId = 'all';
let statsFilterId = 'all';
let visits = [];
let todos = [];
let pendingFiles = [];
let charts = {};

// ── Auth UI ───────────────────────────────────────────────────
let authMode = 'login';
const authTitle = document.getElementById('auth-title');
const authNameInput = document.getElementById('auth-name');
const authEmailInput = document.getElementById('auth-email');
const authPasswordInput = document.getElementById('auth-password');
const authError = document.getElementById('auth-error');
const authSubmitBtn = document.getElementById('auth-submit-btn');
const authToggleBtn = document.getElementById('auth-toggle-btn');

function setAuthMode(mode) {
  authMode = mode;
  authError.textContent = '';
  if (mode === 'signup') {
    authTitle.textContent = 'הרשמה';
    authNameInput.style.display = 'block';
    authSubmitBtn.textContent = 'הרשמה';
    authToggleBtn.textContent = 'יש לך כבר חשבון? התחברות';
  } else {
    authTitle.textContent = 'התחברות';
    authNameInput.style.display = 'none';
    authSubmitBtn.textContent = 'התחברות';
    authToggleBtn.textContent = 'אין לך חשבון? הרשמה';
  }
}
authToggleBtn.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'signup' : 'login'));

authSubmitBtn.addEventListener('click', async () => {
  const email = authEmailInput.value.trim();
  const password = authPasswordInput.value;
  authError.textContent = '';
  if (!email || !password) { authError.textContent = 'נא למלא אימייל וסיסמה'; return; }
  authSubmitBtn.disabled = true;
  try {
    if (authMode === 'signup') {
      await signUp(email, password, authNameInput.value.trim());
    } else {
      await signIn(email, password);
    }
  } catch (err) {
    authError.textContent = friendlyAuthError(err);
  } finally {
    authSubmitBtn.disabled = false;
  }
});

function friendlyAuthError(err) {
  const code = err?.code || '';
  if (code.includes('email-already-in-use')) return 'האימייל כבר רשום במערכת';
  if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'אימייל או סיסמה שגויים';
  if (code.includes('weak-password')) return 'הסיסמה חייבת להכיל לפחות 6 תווים';
  if (code.includes('invalid-email')) return 'כתובת אימייל לא תקינה';
  return 'שגיאה: ' + (err?.message || 'נסי שוב');
}

document.getElementById('logout-btn').addEventListener('click', () => signOutUser());

onAuthChange(async (user) => {
  currentUser = user;
  if (user) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    document.getElementById('header-greeting').textContent = `שלום ${user.displayName || user.email} 👋`;
    document.getElementById('settings-user-email').textContent = user.email;
    await loadAllData();
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-root').style.display = 'none';
  }
});

function selectRecordIssueType(id) {
  selectedRecordIssueTypeId = id;
  renderIssueChipRow('record-issue-chips', issueTypes, selectedRecordIssueTypeId, selectRecordIssueType);
  renderCustomFields();
}
function selectHistoryFilter(id) { historyFilterId = id; renderIssueChipRow('history-filter-chips', issueTypes, historyFilterId, selectHistoryFilter, true); renderHistory(); }
function selectStatsFilter(id) { statsFilterId = id; renderIssueChipRow('stats-filter-chips', issueTypes, statsFilterId, selectStatsFilter, true); renderStats(); }

async function loadAllData() {
  await seedDefaultIssueTypeIfEmpty(currentUser.uid);
  issueTypes = await Data.listIssueTypes(currentUser.uid);
  if (!selectedRecordIssueTypeId && issueTypes.length) selectedRecordIssueTypeId = issueTypes[0].id;
  renderIssueChipRow('record-issue-chips', issueTypes, selectedRecordIssueTypeId, selectRecordIssueType);
  renderIssueChipRow('history-filter-chips', issueTypes, historyFilterId, selectHistoryFilter, true);
  renderIssueChipRow('stats-filter-chips', issueTypes, statsFilterId, selectStatsFilter, true);
  renderCustomFields();
  renderIssueTypesSettings();
  visits = await Data.listVisits(currentUser.uid);
  todos = await Data.listTodos(currentUser.uid);
  renderVisits();
  renderTodos();
  await renderHistory();
  await renderStats();
}

function renderIssueChipRow(containerId, types, activeId, onSelect, includeAll) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const items = includeAll ? [{ id: 'all', name: 'הכל', emoji: '🔎' }, ...types] : types;
  items.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'issue-chip' + (t.id === activeId ? ' active' : '');
    btn.textContent = `${t.emoji || '📌'} ${t.name}`;
    btn.addEventListener('click', () => onSelect(t.id));
    el.appendChild(btn);
  });
}

// ── Level config / gauge (unchanged mechanics) ───────────────
const LEVEL_META = {
  1:{emoji:'😌',color:'#d1fae5',text:'#065f46'}, 2:{emoji:'🙂',color:'#d1fae5',text:'#065f46'},
  3:{emoji:'😐',color:'#fef9c3',text:'#713f12'}, 4:{emoji:'😕',color:'#fef9c3',text:'#713f12'},
  5:{emoji:'😟',color:'#ffedd5',text:'#9a3412'}, 6:{emoji:'😣',color:'#ffedd5',text:'#9a3412'},
  7:{emoji:'😖',color:'#fee2e2',text:'#991b1b'}, 8:{emoji:'😭',color:'#fee2e2',text:'#991b1b'},
  9:{emoji:'🤯',color:'#fce7f3',text:'#9d174d'}, 10:{emoji:'💀',color:'#fce7f3',text:'#9d174d'},
};
const BIG_EMOJIS = ['','😌','🙂','😐','😕','😟','😣','😖','😭','🤯','💀'];
const GAUGE_COLORS = ['#14b8a6','#16a34a','#4ade80','#a3e635','#d4d417','#fbbf24','#fb923c','#f97316','#ef4444','#dc2626'];
const GCX = 150, GCY = 155, R_OUT = 128, R_IN = 80;

function gpt(r, deg) {
  const rad = deg * Math.PI / 180;
  return [GCX + r * Math.cos(rad), GCY - r * Math.sin(rad)];
}
const segG = document.getElementById('gauge-segments');
const segPaths = [];
for (let i = 1; i <= 10; i++) {
  const slot = 11 - i; // mirror: level 1 sits at the left, level 10 at the right
  const a1 = (slot - 1) * 18 + 2.5, a2 = slot * 18 - 2.5;
  const [ox1,oy1] = gpt(R_OUT, a1), [ox2,oy2] = gpt(R_OUT, a2);
  const [ix1,iy1] = gpt(R_IN,  a1), [ix2,iy2] = gpt(R_IN,  a2);
  const d = `M${ox1},${oy1} A${R_OUT},${R_OUT} 0 0,0 ${ox2},${oy2} L${ix2},${iy2} A${R_IN},${R_IN} 0 0,1 ${ix1},${iy1} Z`;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', GAUGE_COLORS[i - 1]);
  path.setAttribute('data-level', i);
  path.style.cursor = 'pointer';
  segG.appendChild(path);
  segPaths.push(path);
}
let selectedLevel = null;
function selectLevel(n) {
  selectedLevel = n;
  const slot = 11 - n;
  const angle = (slot - 0.5) * 18;
  document.getElementById('gauge-needle').style.transform = `rotate(${-angle}deg)`;
  segPaths.forEach(p => p.classList.toggle('dimmed', +p.dataset.level !== n));
  const numEl = document.getElementById('gauge-num');
  numEl.textContent = n;
  numEl.style.fill = GAUGE_COLORS[n - 1];
  numEl.setAttribute('opacity', '1');
  document.getElementById('record-emoji').textContent = BIG_EMOJIS[n];
  updateSaveEnabled();
}
document.getElementById('gauge-svg').addEventListener('pointerdown', e => {
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const scaleX = 300 / rect.width, scaleY = 165 / rect.height;
  const px = (e.clientX - rect.left) * scaleX, py = (e.clientY - rect.top) * scaleY;
  const dx = px - GCX, dy = GCY - py;
  if (dy < -10) return;
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  if (angle < 0 || angle > 180) return;
  const slot = Math.min(10, Math.max(1, Math.ceil(angle / 18)));
  selectLevel(11 - slot);
});

function updateSaveEnabled() {
  document.getElementById('save-btn').disabled = !(selectedLevel && selectedRecordIssueTypeId);
}

// ── Time picker (unchanged) ───────────────────────────────────
const pad = n => String(n).padStart(2, '0');
let selectedTime = '00:00';
const timeGrid = document.getElementById('time-grid');
const TIME_OPTS = [];
for (let h = 0; h < 24; h++) for (let m of [0, 30]) TIME_OPTS.push(`${pad(h)}:${pad(m)}`);
TIME_OPTS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'time-opt'; btn.textContent = t; btn.dataset.val = t;
  btn.addEventListener('click', () => {
    selectedTime = t;
    document.getElementById('time-display').textContent = t;
    document.querySelectorAll('.time-opt').forEach(b => b.classList.toggle('selected', b.dataset.val === t));
    setTimeout(closeTimePicker, 150);
  });
  timeGrid.appendChild(btn);
});
window.openTimePicker = function () {
  document.getElementById('time-modal-backdrop').classList.add('open');
  const sel = timeGrid.querySelector('.time-opt.selected');
  if (sel) sel.scrollIntoView({ block: 'center' });
};
window.closeTimePicker = function (e) {
  if (e && e.target !== document.getElementById('time-modal-backdrop')) return;
  document.getElementById('time-modal-backdrop').classList.remove('open');
};
function setDateTimeNow() {
  const now = new Date();
  document.getElementById('entry-date').value = now.toISOString().slice(0, 10);
  const roundedMin = now.getMinutes() < 30 ? '00' : '30';
  selectedTime = `${pad(now.getHours())}:${roundedMin}`;
  document.getElementById('time-display').textContent = selectedTime;
  document.querySelectorAll('.time-opt').forEach(b => b.classList.toggle('selected', b.dataset.val === selectedTime));
}
setDateTimeNow();

// ── Open/close + duration toggle ──────────────────────────────
const openToggle = document.getElementById('entry-open-toggle');
const durationWrap = document.getElementById('duration-input-wrap');
openToggle.addEventListener('change', () => {
  durationWrap.style.display = openToggle.checked ? 'none' : 'block';
});

// ── Custom fields (dynamic, per issue type) ───────────────────
function currentRecordType() {
  return issueTypes.find(t => t.id === selectedRecordIssueTypeId);
}
function renderCustomFields() {
  const container = document.getElementById('custom-fields-container');
  container.innerHTML = '';
  const type = currentRecordType();
  if (!type || !type.fields) return;
  type.fields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'custom-field';
    const label = document.createElement('label');
    label.textContent = f.label + (f.unit ? ` (${f.unit})` : '');
    wrap.appendChild(label);
    let input;
    if (f.type === 'select') {
      input = document.createElement('select');
      (f.options || []).forEach(opt => {
        const o = document.createElement('option'); o.value = opt; o.textContent = opt; input.appendChild(o);
      });
    } else if (f.type === 'boolean') {
      input = document.createElement('select');
      ['לא','כן'].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; input.appendChild(o); });
    } else {
      input = document.createElement('input');
      input.type = f.type === 'number' ? 'number' : 'text';
    }
    input.dataset.fieldId = f.id;
    input.className = 'custom-field-input';
    wrap.appendChild(input);
    container.appendChild(wrap);
  });
}
function collectCustomFieldValues() {
  const values = {};
  document.querySelectorAll('.custom-field-input').forEach(el => { values[el.dataset.fieldId] = el.value; });
  return values;
}

// ── Save / update entry ─────────────────────────────────────────
let editingEntryId = null;

function resetRecordForm() {
  selectedLevel = null;
  document.getElementById('gauge-num').setAttribute('opacity', '0');
  segPaths.forEach(p => p.classList.remove('dimmed'));
  document.getElementById('record-emoji').textContent = '🤕';
  document.getElementById('note-input').value = '';
  document.getElementById('entry-duration').value = '';
  document.getElementById('entry-open-toggle').checked = true;
  durationWrap.style.display = 'none';
  setDateTimeNow();
  renderCustomFields();
  updateSaveEnabled();
}

function exitEditMode() {
  editingEntryId = null;
  document.getElementById('edit-banner').style.display = 'none';
}

document.getElementById('cancel-edit-btn').addEventListener('click', () => {
  exitEditMode();
  resetRecordForm();
});

function loadEntryIntoForm(entry) {
  editingEntryId = entry.id;
  document.getElementById('edit-banner').style.display = 'flex';
  selectRecordIssueType(entry.issueTypeId);
  selectLevel(entry.severity);
  const d = toDate(entry.startAt);
  document.getElementById('entry-date').value = d.toISOString().slice(0, 10);
  selectedTime = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('time-display').textContent = selectedTime;
  document.querySelectorAll('.time-opt').forEach(b => b.classList.toggle('selected', b.dataset.val === selectedTime));
  const isOpen = entry.status === 'open';
  document.getElementById('entry-open-toggle').checked = isOpen;
  durationWrap.style.display = isOpen ? 'none' : 'block';
  document.getElementById('entry-duration').value = entry.durationHours ?? '';
  document.getElementById('note-input').value = entry.comments?.[0]?.text || '';
  Object.entries(entry.customFieldValues || {}).forEach(([fieldId, val]) => {
    const el = document.querySelector(`.custom-field-input[data-field-id="${fieldId}"]`);
    if (el) el.value = val;
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab[data-page="record"]').classList.add('active');
  document.getElementById('page-record').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('save-btn').addEventListener('click', async () => {
  if (!selectedLevel || !selectedRecordIssueTypeId) return;
  const [h, m] = selectedTime.split(':').map(Number);
  const startAt = new Date(document.getElementById('entry-date').value);
  startAt.setHours(h, m, 0, 0);
  const note = document.getElementById('note-input').value.trim();
  const isOpen = document.getElementById('entry-open-toggle').checked;
  const durationHours = isOpen ? null : parseFloat(document.getElementById('entry-duration').value) || 0;
  const customFieldValues = collectCustomFieldValues();
  const comments = note ? [{ text: note, createdAt: new Date().toISOString() }] : [];

  if (editingEntryId) {
    const patch = {
      issueTypeId: selectedRecordIssueTypeId,
      startAt: Timestamp.fromDate(startAt),
      severity: selectedLevel,
      customFieldValues,
      comments,
      status: isOpen ? 'open' : 'closed',
      endAt: isOpen ? null : Timestamp.fromDate(new Date(startAt.getTime() + durationHours * 3600000)),
      durationHours: isOpen ? null : durationHours
    };
    await Data.updateEntry(currentUser.uid, editingEntryId, patch);
    exitEditMode();
    showToast('✅ עודכן!');
  } else {
    const entryRef = await Data.createEntry(currentUser.uid, {
      issueTypeId: selectedRecordIssueTypeId,
      startAt: Timestamp.fromDate(startAt),
      severity: selectedLevel,
      customFieldValues,
      comments
    });
    if (!isOpen) {
      const endAt = new Date(startAt.getTime() + durationHours * 3600000);
      await Data.closeEntry(currentUser.uid, entryRef.id, Timestamp.fromDate(endAt));
    }
    showToast('✅ נשמר!');
  }

  resetRecordForm();
  await renderHistory();
  await renderStats();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ── History ───────────────────────────────────────────────────
let historyEntriesCache = [];
async function renderHistory() {
  if (!currentUser) return;
  const el = document.getElementById('history-list');
  const entries = await Data.listEntries(currentUser.uid, {
    issueTypeId: historyFilterId === 'all' ? undefined : historyFilterId
  });
  historyEntriesCache = entries;
  if (!entries.length) {
    el.innerHTML = `<div class="history-empty"><span class="empty-emoji">🌸</span>אין רשומות עדיין.<br>תעדי את הרשומה הראשונה שלך!</div>`;
    return;
  }
  el.innerHTML = entries.map(e => {
    const type = issueTypes.find(t => t.id === e.issueTypeId);
    const meta = LEVEL_META[e.severity] || LEVEL_META[5];
    const date = e.startAt?.toDate ? e.startAt.toDate() : new Date(e.startAt);
    const note = e.comments && e.comments[0] ? e.comments[0].text : '';
    const statusHtml = e.status === 'open'
      ? `<div class="entry-status open">🟠 פתוח</div>`
      : `<div class="entry-status closed">${e.durationHours != null ? `⏱ ${e.durationHours.toFixed(1)} שעות` : '✅ סגור'}</div>`;
    const closeBtn = e.status === 'open' ? `<button class="entry-close-btn" data-close="${e.id}">✔️ סגור עכשיו</button>` : '';
    return `
      <div class="entry-card">
        <div class="entry-badge" style="background:${meta.color};color:${meta.text}">
          <span class="badge-emoji">${type?.emoji || '📌'}</span>
          <span class="badge-num">${e.severity}</span>
        </div>
        <div class="entry-info">
          <div class="entry-date">${type?.name || ''} · ${date.toLocaleDateString('he-IL')} ${date.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div>
          ${note ? `<div class="entry-note">${escapeHtml(note)}</div>` : ''}
          ${statusHtml}
        </div>
        <div class="entry-actions">
          ${closeBtn}
          <button class="entry-close-btn" data-edit="${e.id}">✏️ ערוך</button>
          <button class="entry-delete" data-del="${e.id}">🗑</button>
        </div>
      </div>`;
  }).join('');
  el.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
    await Data.deleteEntry(currentUser.uid, btn.dataset.del);
    await renderHistory(); await renderStats();
  }));
  el.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', async () => {
    await Data.closeEntry(currentUser.uid, btn.dataset.close, Timestamp.now());
    await renderHistory(); await renderStats();
  }));
  el.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
    const entry = historyEntriesCache.find(x => x.id === btn.dataset.edit);
    if (entry) loadEntryIntoForm(entry);
  }));
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Stats ─────────────────────────────────────────────────────
async function renderStats() {
  if (!currentUser) return;
  const entries = await Data.listEntries(currentUser.uid, {
    issueTypeId: statsFilterId === 'all' ? undefined : statsFilterId
  });
  const grid = document.getElementById('stats-grid');
  const avg = entries.length ? (entries.reduce((s,e)=>s+e.severity,0)/entries.length).toFixed(1) : '–';
  const openCount = entries.filter(e => e.status === 'open').length;
  const last30 = entries.filter(e => {
    const d = e.startAt?.toDate ? e.startAt.toDate() : new Date(e.startAt);
    return (Date.now() - d.getTime()) < 30*24*3600000;
  }).length;
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-emoji">📈</div><div class="stat-val">${entries.length}</div><div class="stat-lbl">סה"כ רשומות</div></div>
    <div class="stat-card"><div class="stat-emoji">🌡️</div><div class="stat-val">${avg}</div><div class="stat-lbl">עוצמה ממוצעת</div></div>
    <div class="stat-card"><div class="stat-emoji">🟠</div><div class="stat-val">${openCount}</div><div class="stat-lbl">אירועים פתוחים</div></div>
    <div class="stat-card"><div class="stat-emoji">🗓️</div><div class="stat-val">${last30}</div><div class="stat-lbl">ב-30 יום אחרונים</div></div>
  `;

  const sorted = [...entries].sort((a,b) => toDate(a.startAt) - toDate(b.startAt));
  const timelineLabels = sorted.map(e => toDate(e.startAt).toLocaleDateString('he-IL'));
  const timelineData = sorted.map(e => e.severity);

  const dowCounts = [0,0,0,0,0,0,0];
  entries.forEach(e => dowCounts[toDate(e.startAt).getDay()]++);
  const dowLabels = ['א','ב','ג','ד','ה','ו','ש'];

  const distCounts = Array(10).fill(0);
  entries.forEach(e => distCounts[e.severity-1]++);

  renderChart('chart-timeline', 'line', timelineLabels, [{ label: 'עוצמה', data: timelineData, borderColor: '#a855f7', backgroundColor: 'rgba(168,85,247,0.15)', fill: true, tension: 0.3 }]);
  renderChart('chart-dow', 'bar', dowLabels, [{ label: 'כמות', data: dowCounts, backgroundColor: '#60a5fa' }]);
  renderChart('chart-dist', 'bar', Array.from({length:10},(_,i)=>i+1), [{ label: 'כמות', data: distCounts, backgroundColor: GAUGE_COLORS }]);
}
function toDate(ts) { return ts?.toDate ? ts.toDate() : new Date(ts); }
function renderChart(canvasId, type, labels, datasets) {
  if (charts[canvasId]) charts[canvasId].destroy();
  charts[canvasId] = new Chart(document.getElementById(canvasId), {
    type, data: { labels, datasets },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

// ── Medical: tab switching ────────────────────────────────────
document.querySelectorAll('.med-subtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.med-subtab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.med-section').forEach(s => s.classList.remove('active'));

// ── Visits ────────────────────────────────────────────────────
document.getElementById('add-visit-trigger').addEventListener('click', () => toggleVisitForm(true));
window.toggleVisitForm = function (open) {
  document.getElementById('visit-form').classList.toggle('open', open);
  if (!open) resetVisitForm();
};
function resetVisitForm() {
  document.getElementById('v-doctor').value = '';
  document.getElementById('v-date').value = '';
  document.getElementById('v-summary').value = '';
  document.getElementById('v-files-preview').innerHTML = '';
  pendingFiles = [];
}
window.previewFiles = function (input) {
  const preview = document.getElementById('v-files-preview');
  [...input.files].forEach(file => {
    if (file.size > 500 * 1024) { showToast('⚠️ קובץ גדול מדי (מקס 500KB)'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      pendingFiles.push({ name: file.name, type: file.type, dataUrl: reader.result });
      const chip = document.createElement('span');
      chip.className = 'file-preview-chip';
      chip.innerHTML = `📎 ${file.name} <button type="button">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => { removeFile(chip, file.name); });
      preview.appendChild(chip);
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
};
function removeFile(chipEl, name) {
  pendingFiles = pendingFiles.filter(f => f.name !== name);
  chipEl.remove();
}
window.saveVisit = async function () {
  const doctorName = document.getElementById('v-doctor').value.trim();
  const date = document.getElementById('v-date').value;
  const summary = document.getElementById('v-summary').value.trim();
  if (!doctorName || !date) { showToast('⚠️ נא למלא שם רופא ותאריך'); return; }
  await Data.createVisit(currentUser.uid, { doctorName, date, summary, attachments: pendingFiles });
  toggleVisitForm(false);
  visits = await Data.listVisits(currentUser.uid);
  renderVisits();
  showToast('✅ ביקור נשמר!');
};
function renderVisits() {
  const el = document.getElementById('visits-list');
  if (!visits.length) {
    el.innerHTML = `<div class="med-empty"><span class="med-empty-emoji">🏥</span>אין ביקורים רשומים עדיין.</div>`;
    return;
  }
  el.innerHTML = visits.map(v => `
    <div class="visit-card" id="visit-${v.id}">
      <div class="visit-header" data-toggle="${v.id}">
        <div class="visit-icon">👨‍⚕️</div>
        <div class="visit-meta">
          <div class="v-doctor">${escapeHtml(v.doctorName)}</div>
          <div class="v-date">${new Date(v.date).toLocaleDateString('he-IL')}</div>
        </div>
        <div class="visit-chevron">▾</div>
      </div>
      <div class="visit-body">
        ${v.summary ? `<div class="visit-summary">${escapeHtml(v.summary)}</div>` : ''}
        ${v.attachments?.length ? `<div class="visit-files">${v.attachments.map(f => `<a class="file-chip" href="${f.dataUrl}" download="${f.name}">📎 ${f.name}</a>`).join('')}</div>` : ''}
        <button class="visit-delete-btn" data-del-visit="${v.id}">🗑 מחק ביקור</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-toggle]').forEach(h => h.addEventListener('click', () => {
    document.getElementById('visit-' + h.dataset.toggle).classList.toggle('open');
  }));
  el.querySelectorAll('[data-del-visit]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    await Data.deleteVisit(currentUser.uid, b.dataset.delVisit);
    visits = await Data.listVisits(currentUser.uid);
    renderVisits();
  }));
}

// ── Todos ─────────────────────────────────────────────────────
window.addTodo = async function () {
  const input = document.getElementById('todo-input');
  const text = input.value.trim();
  if (!text) return;
  await Data.createTodo(currentUser.uid, text);
  input.value = '';
  todos = await Data.listTodos(currentUser.uid);
  renderTodos();
};
function renderTodos() {
  const el = document.getElementById('todos-list');
  if (!todos.length) {
    el.innerHTML = `<div class="med-empty"><span class="med-empty-emoji">✅</span>אין משימות עדיין.</div>`;
    return;
  }
  el.innerHTML = todos.map(t => `
    <div class="todo-item ${t.done ? 'done' : ''}">
      <button class="todo-check" data-toggle-todo="${t.id}">${t.done ? '✓' : ''}</button>
      <span class="todo-text">${escapeHtml(t.text)}</span>
      <button class="todo-del" data-del-todo="${t.id}">🗑</button>
    </div>`).join('');
  el.querySelectorAll('[data-toggle-todo]').forEach(b => b.addEventListener('click', async () => {
    const t = todos.find(x => x.id === b.dataset.toggleTodo);
    await Data.updateTodo(currentUser.uid, t.id, { done: !t.done });
    todos = await Data.listTodos(currentUser.uid);
    renderTodos();
  }));
  el.querySelectorAll('[data-del-todo]').forEach(b => b.addEventListener('click', async () => {
    await Data.deleteTodo(currentUser.uid, b.dataset.delTodo);
    todos = await Data.listTodos(currentUser.uid);
    renderTodos();
  }));
}

// ── Settings: issue types management ──────────────────────────
let editingFields = [];
document.getElementById('add-issue-type-trigger').addEventListener('click', () => {
  editingFields = [];
  document.getElementById('it-name').value = '';
  document.getElementById('it-emoji').value = '';
  renderFieldsBuilder();
  document.getElementById('issue-type-form').classList.add('open');
});
document.getElementById('it-cancel-btn').addEventListener('click', () => {
  document.getElementById('issue-type-form').classList.remove('open');
});
document.getElementById('it-add-field-btn').addEventListener('click', () => {
  editingFields.push({ id: 'f' + Date.now(), label: '', type: 'number', unit: '', options: [] });
  renderFieldsBuilder();
});
function renderFieldsBuilder() {
  const el = document.getElementById('it-fields-list');
  el.innerHTML = editingFields.map((f, i) => `
    <div class="custom-field-row">
      <input class="field-input" style="flex:2" placeholder="שם שדה" data-cf-label="${i}" value="${escapeHtml(f.label)}" />
      <select class="field-input" style="flex:1" data-cf-type="${i}">
        <option value="number" ${f.type==='number'?'selected':''}>מספר</option>
        <option value="text" ${f.type==='text'?'selected':''}>טקסט</option>
        <option value="select" ${f.type==='select'?'selected':''}>בחירה</option>
        <option value="boolean" ${f.type==='boolean'?'selected':''}>כן/לא</option>
      </select>
      <button type="button" class="cf-del" data-cf-del="${i}">✕</button>
    </div>
    ${f.type === 'select' ? `<input class="field-input" placeholder="אפשרויות מופרדות בפסיק" data-cf-options="${i}" value="${escapeHtml((f.options||[]).join(', '))}" />` : ''}
  `).join('');
  el.querySelectorAll('[data-cf-label]').forEach(inp => inp.addEventListener('input', () => { editingFields[+inp.dataset.cfLabel].label = inp.value; }));
  el.querySelectorAll('[data-cf-type]').forEach(sel => sel.addEventListener('change', () => { editingFields[+sel.dataset.cfType].type = sel.value; renderFieldsBuilder(); }));
  el.querySelectorAll('[data-cf-options]').forEach(inp => inp.addEventListener('input', () => { editingFields[+inp.dataset.cfOptions].options = inp.value.split(',').map(s=>s.trim()).filter(Boolean); }));
  el.querySelectorAll('[data-cf-del]').forEach(btn => btn.addEventListener('click', () => { editingFields.splice(+btn.dataset.cfDel, 1); renderFieldsBuilder(); }));
}
document.getElementById('it-save-btn').addEventListener('click', async () => {
  const name = document.getElementById('it-name').value.trim();
  const emoji = document.getElementById('it-emoji').value.trim();
  if (!name) { showToast('⚠️ נא להזין שם'); return; }
  await Data.createIssueType(currentUser.uid, { name, emoji, fields: editingFields.filter(f => f.label) });
  document.getElementById('issue-type-form').classList.remove('open');
  issueTypes = await Data.listIssueTypes(currentUser.uid);
  if (!selectedRecordIssueTypeId) selectedRecordIssueTypeId = issueTypes[0]?.id;
  renderIssueTypesSettings();
  renderIssueChipRow('record-issue-chips', issueTypes, selectedRecordIssueTypeId, selectRecordIssueType);
  renderIssueChipRow('history-filter-chips', issueTypes, historyFilterId, selectHistoryFilter, true);
  renderIssueChipRow('stats-filter-chips', issueTypes, statsFilterId, selectStatsFilter, true);
  renderCustomFields();
});
function renderIssueTypesSettings() {
  const el = document.getElementById('issue-types-list');
  el.innerHTML = issueTypes.map(t => `
    <div class="issue-type-card">
      <span class="it-emoji">${t.emoji || '📌'}</span>
      <span class="it-name">${escapeHtml(t.name)}</span>
      <span class="it-fields-count">${(t.fields||[]).length} שדות</span>
      <button class="todo-del" data-del-type="${t.id}">🗑</button>
    </div>`).join('');
  el.querySelectorAll('[data-del-type]').forEach(btn => btn.addEventListener('click', async () => {
    await Data.deleteIssueType(currentUser.uid, btn.dataset.delType);
    if (selectedRecordIssueTypeId === btn.dataset.delType) selectedRecordIssueTypeId = null;
    await loadAllData();
  }));
}

document.querySelectorAll('.tab').forEach(btn => {

    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
